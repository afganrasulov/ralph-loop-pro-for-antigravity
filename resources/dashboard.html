<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ralph Loop Dashboard</title>
    <link rel="stylesheet" href="{cssUri}">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar: Configuration -->
        <aside class="sidebar">
            <div class="logo-section">
                <img src="{logoUri}" alt="Ralph Logo">
                <h1>Ralph Loop</h1>
            </div>

            <div class="config-group">
                <div class="config-label">Loop Control</div>
                <div class="button-row">
                    <button id="startBtn" class="btn btn-primary" title="Start Loop">
                        <span>▶</span> Start
                    </button>
                    <button id="pauseBtn" class="btn btn-secondary" title="Pause Loop" disabled>
                        <span>⏸</span>
                    </button>
                    <button id="stopBtn" class="btn btn-danger" title="Stop Loop" disabled>
                        <span>⏹</span>
                    </button>
                </div>
            </div>

            <div class="config-group">
                <div class="config-label">Mode & Model</div>
                <div class="config-item">
                    <select id="modeSelect">
                        <option value="Fast">Fast Mode</option>
                        <option value="Planning">Planning Mode</option>
                    </select>
                </div>
                <div class="config-item">
                    <select id="modelSelect">
                        <option value="Gemini 3 Flash">Gemini 3 Flash</option>
                        <option value="Gemini 3 Pro (Low)">Gemini 3 Pro (Low)</option>
                        <option value="Claude Sonnet 4.5">Claude Sonnet 4.5</option>
                        <option value="Claude Opus 4.6">Claude Opus 4.6</option>
                    </select>
                </div>
            </div>

            <div class="config-group">
                <div class="config-label">Iteration Limits</div>
                <div class="config-item">
                    <input type="number" id="maxIterations" value="50" min="1" max="1000">
                </div>
            </div>

            <div class="config-group" style="margin-top: auto;">
                <button id="settingsBtn" class="btn btn-secondary">
                    <span>⚙</span> Advanced Settings
                </button>
            </div>
        </aside>

        <!-- Main Content: Status & Logs -->
        <main class="main-content">
            <header class="status-header">
                <div id="statusBadge" class="status-badge stopped">
                    <div class="pulse"></div>
                    <span id="statusText">STOPPED</span>
                </div>
                <div class="button-row">
                    <button id="clearLogsBtn" class="btn btn-secondary btn-sm">Clear Logs</button>
                </div>
            </header>

            <section class="stats-grid">
                <div class="stat-card">
                    <div class="config-label">Iterations</div>
                    <div id="iterCount" class="stat-value">0 / 50</div>
                </div>
                <div class="stat-card">
                    <div class="config-label">Elapsed Time</div>
                    <div id="elapsedTime" class="stat-value">00:00</div>
                </div>
                <div class="stat-card">
                    <div class="config-label">Cascade Session</div>
                    <div id="cascadeId" class="stat-value" style="font-size: 1rem; color: var(--text-muted);">None</div>
                </div>
            </section>

            <section class="log-container" id="logContainer">
                <div class="log-entry"><span class="log-time">[18:42:00]</span> <span class="log-info">Ready to start autonomous loop...</span></div>
            </section>
        </main>
    </div>

    <script src="{jsUri}"></script>
</body>
</html>
