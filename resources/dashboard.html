<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ralph Loop Dashboard</title>
    <link rel="stylesheet" href="{cssUri}">
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar: Configuration -->
        <aside class="sidebar">
            <div class="logo-section">
                <img src="{logoUri}" alt="Ralph Logo">
                <h1>Ralph Loop</h1>
            </div>

            <div class="config-group">
                <div class="config-label">Loop Control</div>
                <div class="button-row">
                    <button id="startBtn" class="btn btn-primary" title="Start Loop">
                        <span>▶</span> Start
                    </button>
                    <button id="pauseBtn" class="btn btn-secondary" title="Pause Loop" disabled>
                        <span>⏸</span>
                    </button>
                    <button id="stopBtn" class="btn btn-danger" title="Stop Loop" disabled>
                        <span>⏹</span>
                    </button>
                </div>
            </div>

            <div class="config-group">
                <div class="config-label">Mode & Model</div>
                <div class="config-item">
                    <select id="modeSelect">
                        <option value="Fast">Fast Mode</option>
                        <option value="Planning">Planning Mode</option>
                    </select>
                </div>
                <div class="config-item">
                    <select id="modelSelect">
                        <!-- Dynamically populated -->
                    </select>
                </div>
            </div>

            <div class="config-group">
                <div class="config-label">File Settings</div>
                <div class="config-item file-input">
                    <span class="input-icon">📄</span>
                    <input type="text" id="promptFile" placeholder="Prompt File (e.g. PROMPT.md)">
                </div>
                <div class="config-item file-input">
                    <span class="input-icon">📋</span>
                    <input type="text" id="taskFile" placeholder="Task File (e.g. TASKS.md)">
                </div>
                <div class="config-item file-input">
                    <span class="input-icon">📝</span>
                    <input type="text" id="progressFile" placeholder="Progress File (e.g. progress.txt)">
                </div>
            </div>

            <div class="config-group">
                <div class="config-label">Limits & Thresholds</div>
                <div class="config-item">
                    <div class="input-with-label">
                        <span>Max Iterations:</span>
                        <input type="number" id="maxIterations" value="50" min="1" max="1000">
                    </div>
                </div>
                <div class="config-item">
                    <div class="input-with-label">
                        <span>Stable Threshold:</span>
                        <input type="number" id="stableThreshold" value="7" min="1" max="100">
                    </div>
                </div>
            </div>

            <div class="config-group">
                <button id="advancedToggle" class="btn-toggle">
                    <span class="icon">⚙</span>
                    <span>Advanced Settings</span>
                    <span id="advancedChevron" class="chevron">▶</span>
                </button>
                <div id="advancedContent" class="advanced-content hidden">
                    <label class="checkbox-container">
                        <input type="checkbox" id="pseudoRalph">
                        <span class="checkmark"></span>
                        Pseudo Ralph (Reuse session)
                    </label>
                    <label class="checkbox-container">
                        <input type="checkbox" id="useGit">
                        <span class="checkmark"></span>
                        Enable Git Integration
                    </label>
                    <label class="checkbox-container" id="branchOption">
                        <input type="checkbox" id="createBranch">
                        <span class="checkmark"></span>
                        New branch per session
                    </label>
                </div>
            </div>

            <div class="config-group" style="margin-top: auto;">
                <button id="settingsBtn" class="btn btn-secondary">
                    <span>⚙</span> VS Code Settings
                </button>
            </div>
        </aside>

        <!-- Main Content: Status & Logs -->
        <main class="main-content">
            <header class="status-header">
                <div id="statusBadge" class="status-badge stopped">
                    <div class="pulse"></div>
                    <span id="statusText">STOPPED</span>
                </div>
                <div class="button-row">
                    <button id="clearLogsBtn" class="btn btn-secondary btn-sm">Clear Logs</button>
                </div>
            </header>

            <section class="stats-grid">
                <div class="stat-card">
                    <div class="config-label">Iterations</div>
                    <div id="iterCount" class="stat-value">0 / 50</div>
                </div>
                <div class="stat-card">
                    <div class="config-label">Elapsed Time</div>
                    <div id="elapsedTime" class="stat-value">00:00</div>
                </div>
                <div class="stat-card">
                    <div class="config-label">Cascade Session</div>
                    <div id="cascadeId" class="stat-value"
                        style="font-size: 1rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                        None</div>
                </div>
            </section>

            <section class="log-container" id="logContainer">
                <div class="log-entry"><span class="log-time">[Ready]</span> <span class="log-info">Dashboard
                        initialized. Waiting for loop start...</span></div>
            </section>
        </main>
    </div>

    <script src="{jsUri}"></script>
</body>

</html>
